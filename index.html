    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ma_active_theme_preset');
          if (saved === 'minimal-light') {
            document.documentElement.setAttribute('data-theme', 'minimal-light');
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.setAttribute('data-theme', saved || 'obsidian');
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
